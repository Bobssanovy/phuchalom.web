<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จองที่พัก ภูชาโลม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--forest:#2f5d3a;--forest-d:#244a2d;--moss:#6a8f55;--sand:#f7f2e8;--card:#fffdf8;--ink:#1f2a24;--mute:#6b746d;--line:#e6dfcf;
--clay:#c9772f;--amber:#d99a1c;--blue:#3b7dd8;--ok:#2e8b57;--bad:#c0392b;--grey:#9aa39c;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px}
#app.wide{max-width:1280px}
h1{font-size:20px;margin:6px 0 2px}h2{font-size:17px;margin:18px 0 8px}h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--moss);border-color:var(--moss)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--forest);color:#fff;cursor:pointer;width:100%}
.btn:active{background:var(--forest-d)}.btn.sec{background:#fff;color:var(--forest);border:1px solid var(--forest)}
.btn.bad{background:var(--bad)}.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:9px}.btn[disabled]{opacity:.5}
.stack>*+*{margin-top:10px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;background:var(--grey)}
.chip.PENDING_PAYMENT{background:var(--amber)}.chip.PAYMENT_REVIEW{background:var(--blue)}.chip.CONFIRMED{background:var(--ok)}
.chip.CANCELLED,.chip.EXPIRED{background:var(--grey)}.chip.PENDING_REVIEW{background:var(--blue)}.chip.APPROVED{background:var(--ok)}.chip.REJECTED{background:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}
.kv b{text-align:right}.big{font-size:22px;font-weight:700}
.muted{color:var(--mute)}.warn{background:#fff4dc;border:1px solid #f0d28a;color:#7a5a00;padding:10px 12px;border-radius:10px;font-size:13px}
.ok{background:#e6f4e8;border:1px solid #a9d5b0;color:#1f5a2b;padding:10px 12px;border-radius:10px;font-size:13px}
.err{background:#fdeceb;border:1px solid #f1b8b3;color:#8e2a20;padding:10px 12px;border-radius:10px;font-size:13px}
.okbox{background:#e8f5ee;border:1px solid #b6dcc6;color:#1d5a3a;padding:10px 12px;border-radius:10px;font-size:13px}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-size:17px}
.zone{margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.units{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.unit{border:1.5px solid var(--moss);background:#fff;border-radius:10px;padding:8px 2px;text-align:center;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
.unit small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.unit.sel{background:var(--forest);color:#fff;border-color:var(--forest)}.unit.sel small{color:#dbe9d2}
.unit.off{background:#eee;border-color:#e0e0e0;color:#aaa;cursor:not-allowed;text-decoration:line-through}
.bar{position:fixed;left:0;right:0;bottom:62px;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:20;max-width:560px;margin:0 auto}
.bar .btn{width:auto;padding:11px 20px}.bar>div{flex:1;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 7px;font:inherit;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button.on{color:var(--forest);font-weight:700}nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;z-index:99}
.overlay.on{display:flex}.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--forest);border-radius:50%;animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(20,30,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.modal>div{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:18px}}
.slip{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin:8px auto}
.copy{background:var(--sand);border:1px dashed var(--moss);border-radius:10px;padding:10px;font-size:14px}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kpis .card{margin:0}.kpis .big{margin-top:2px}
/* calendar */
.cal{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:70vh}
.cal table{border-collapse:separate;border-spacing:0;font-size:11px}
.cal th,.cal td{border-right:1px solid #f0ebdd;border-bottom:1px solid #f0ebdd;text-align:center;padding:0;min-width:30px;height:26px}
.cal th{position:sticky;top:0;background:#faf6ec;z-index:2;font-weight:600;height:40px;line-height:1.15}
.cal th.u,.cal td.u{position:sticky;left:0;z-index:3;background:#faf6ec;min-width:58px;text-align:left;padding:0 8px;font-weight:600}
.cal th.u{z-index:4}.cal th.we{background:#f3e7d1}.cal th.today{background:var(--clay);color:#fff}
.cal td.we{background:#fdf9f0}.cal td.c{cursor:pointer}.cal td.PENDING_PAYMENT{background:var(--amber)}.cal td.PAYMENT_REVIEW{background:var(--blue)}.cal td.CONFIRMED{background:var(--ok)}
.cal td.s{border-left:3px solid #fff}.cal tr.zh td{background:#eee7d3;font-weight:700;text-align:left;padding:2px 8px;height:22px;position:sticky;left:0}
.cal tfoot td{background:#faf6ec;font-weight:600;position:sticky;bottom:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:8px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}.mnav b{font-size:17px}
table.list{width:100%;border-collapse:collapse;font-size:13px}table.list th,table.list td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.hide{display:none}
/* ===== หน้าจอง: ขั้นตอน + ผัง ===== */
.hero{background:linear-gradient(135deg,#2f5d3a,#4d8050);color:#fff;border-radius:16px;padding:14px 16px;margin:0 0 12px}
.hero-t{font-size:20px;font-weight:700}.hero-s{font-size:12.5px;opacity:.92;margin-top:2px}
.steps{display:flex;align-items:flex-start;margin:2px 0 14px}
.step{flex:1;text-align:center;position:relative;font-size:11.5px;color:var(--mute);line-height:1.25;padding:0 2px}
.step i{display:flex;width:34px;height:34px;border-radius:50%;margin:0 auto 5px;align-items:center;justify-content:center;background:#e8e3d3;color:var(--mute);font-style:normal;font-weight:700;font-size:15px;position:relative;z-index:1}
.step.done i{background:var(--ok);color:#fff}.step.on i{background:var(--forest);color:#fff;box-shadow:0 0 0 4px #d9e8d3}.step.on{color:var(--ink);font-weight:700}
.step:not(:last-child)::after{content:'';position:absolute;top:16px;left:calc(50% + 21px);right:calc(-50% + 21px);height:2px;background:#e0dac8}
.step.done:not(:last-child)::after{background:var(--ok)}
h2.ttl{margin:0 0 2px;font-size:18px}
.nights{background:#eef4e8;border-radius:10px;padding:9px 12px;margin:12px 0;text-align:center;color:var(--forest-d)}
.zchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.zchip{border:0;border-radius:99px;padding:5px 13px;font:inherit;font-size:12.5px;font-weight:600;color:#fff;background:var(--c,var(--forest));cursor:pointer}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.calhead span{display:block;font-size:12px;color:var(--mute)}.calhead b{font-size:15px}.calhead .arrow{font-size:20px;color:var(--ink)}
.calwrap{max-height:min(58vh,470px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.calmt{text-align:center;font-weight:700;margin:16px 0 6px}
.caldow,.calgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.caldow span{font-size:13px;color:var(--mute);padding:6px 0}
.cd{border:0;background:transparent;font:inherit;font-size:16px;height:44px;color:var(--ink);cursor:pointer;position:relative;padding:0;z-index:0}
.cd.off{color:#c5cbc6;cursor:default}.cd.today{font-weight:800;text-decoration:underline}
.cd.r{background:#dcebdd}.cd.s,.cd.e{color:#fff;font-weight:700}
.cd.s::before,.cd.e::before{content:'';position:absolute;left:50%;top:50%;width:42px;height:42px;transform:translate(-50%,-50%);border-radius:50%;background:var(--forest,#2f5d3a);z-index:-1}
.cd.hasr{background:linear-gradient(90deg,transparent 50%,#dcebdd 50%)}.cd.e{background:linear-gradient(90deg,#dcebdd 50%,transparent 50%)}
.cd:disabled{pointer-events:none}
.mapbox{position:relative;margin:0 -16px}
.mapscroll{overflow:hidden;border-radius:0;border:0;background:#cfe3c3;-webkit-overflow-scrolling:touch;cursor:grab}
.mapscroll.grab{cursor:grabbing;user-select:none}
.map{position:relative;--mw:720px;aspect-ratio:1400/788;background:#bcd9a8}
.map img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);width:calc(var(--mw)*.029);height:calc(var(--mw)*.029);min-width:15px;min-height:15px;letter-spacing:-.4px;border-radius:50%;border:1.5px solid #fff;color:#fff;font-family:inherit;font-weight:700;font-size:max(6.5px,calc(var(--mw)*.0128));padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.5);letter-spacing:-.3px}
.pin.FREE,.chipu.FREE,.lg.FREE::before{background:#4fae3c}.pin.HOLD,.chipu.HOLD,.lg.HOLD::before{background:#f0a21c}
.pin.BOOKED,.chipu.BOOKED,.lg.BOOKED::before{background:#d9423c}.pin.CLOSED,.chipu.CLOSED,.lg.CLOSED::before{background:#9aa39c}
.pin.sel,.chipu.sel{background:#16c24a!important;border-color:#fff;transform:translate(-50%,-50%) scale(1.25);box-shadow:0 0 0 2px #fff,0 0 0 4px #ffd23f,0 0 10px 5px rgba(255,210,63,.8);z-index:6;animation:selpulse 1.4s ease-in-out infinite}
.pin.tarpsel,.chipu.tarpsel{background:#7b3fb3!important;border-color:#fff;transform:translate(-50%,-50%) scale(1.25);box-shadow:0 0 0 2px #fff,0 0 0 4px #c9a6ee,0 0 10px 5px rgba(123,63,179,.6);z-index:6}
.pin.tarpsel::after{content:'ทาร์ป';position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#7b3fb3;border:1px solid #fff;color:#fff;border-radius:6px;padding:0 3px;font-size:max(7px,calc(var(--mw)*.0075));line-height:1.3;white-space:nowrap}
.lg.TARPSEL::before{background:#7b3fb3}
@keyframes selpulse{50%{box-shadow:0 0 0 2px #fff,0 0 0 6px rgba(255,210,63,.6),0 0 14px 7px rgba(255,210,63,.5)}}
.pin.sel::after{content:'✓';position:absolute;right:-6px;top:-8px;width:calc(var(--mw)*.0135);height:calc(var(--mw)*.0135);min-width:12px;min-height:12px;border-radius:50%;background:#2e8b57;border:1.5px solid #fff;color:#fff;font-size:max(8px,calc(var(--mw)*.0085));display:flex;align-items:center;justify-content:center;line-height:1}
.mapctl{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.3);overflow:hidden}
.mapctl button{width:38px;height:38px;border:0;background:#fff;font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}.mapctl button+button{border-top:1px solid var(--line)}
.maptoast{position:absolute;left:10px;right:60px;bottom:12px;background:rgba(31,42,36,.92);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.maptoast.on{opacity:1}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:10px 0 2px}
.lg::before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.offmap{margin-top:8px}.chipu{display:inline-block;margin:0 6px 6px 0;border:2px solid #fff;border-radius:99px;padding:4px 12px;color:#fff;font:inherit;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.selcard{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--ok);border-radius:var(--r);padding:12px;margin:0 0 10px}
.sc-l{display:flex;flex-direction:column;gap:6px;align-items:center}.sc-tag{color:#fff;font-weight:700;font-size:18px;border-radius:10px;padding:4px 14px}.sc-st{background:#dff3e4;color:#1d6b3b;font-size:12px;font-weight:600;border-radius:99px;padding:1px 10px}
.sc-m{flex:1;min-width:0;font-size:14px}.sc-x{width:34px;height:34px;border-radius:50%;border:0;background:var(--ok);color:#fff;font-size:18px;font-weight:700;cursor:pointer;flex:none}
.selhint{background:#fff;border:1.5px dashed var(--moss);border-radius:var(--r);padding:14px;margin:0 0 10px;text-align:center;color:var(--mute);font-size:14px}
.sumcard h3{font-size:16px;margin:0 0 6px}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eee7d6;font-size:14px}.sumrow b{text-align:right;font-weight:600}.sumrow.sub2{font-size:13px;color:var(--mute);padding:3px 0 3px 18px;border:0}
.sumtotal{display:flex;justify-content:space-between;align-items:center;background:#e4f1dd;border-radius:10px;padding:10px 14px;margin-top:10px;color:var(--forest-d);font-weight:700}.sumtotal b{font-size:24px}
</style>
</head>
<body>
<div id="app"><div class="card" style="text-align:center;margin-top:30vh"><div class="spin" style="margin:0 auto 10px"></div>กำลังเข้าสู่ระบบ…</div></div>
<div id="ver" style="text-align:center;font-size:10px;color:#9aa39c;padding:4px 0 74px"></div>
<nav id="nav" class="hide"></nav>
<div class="overlay" id="busy"><div class="spin"></div></div>
<div id="modalRoot"></div>

const money = n => '฿' + Number(n || 0).toLocaleString('th-TH');
const pad = n => String(n).padStart(2, '0');
function fmtDate(ymd, withDow) {
  if (!ymd) return '-';
  const [y, m, d] = ymd.split('-').map(Number);
  const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  return (withDow ? TH_DOW[dow] + ' ' : '') + d + ' ' + TH_MONTH[m - 1] + ' ' + (y + 543);
}
function fmtDT(s) { if (!s) return '-'; const [d, t] = s.split(' '); return fmtDate(d) + ' ' + (t || '').slice(0, 5); }
const addDays = (ymd, n) => { const [y, m, d] = ymd.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); };
const todayStr = () => S.me ? S.me.today : new Date().toISOString().slice(0, 10);

function toast(msg, kind) { return `<div class="${kind || 'err'}" style="margin:0 0 12px">${esc(msg)}</div>`; }

async function api(action, params) {
  const idToken = liff.getIDToken();

    const res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, params: params || {}, idToken }) });

    const e = new Error('เชื่อมต่อระบบหลังบ้านไม่ได้ (Apps Script) — ตรวจว่า Deploy เป็น New version แล้ว, ตั้ง Who has access = Anyone, และในโปรเจกต์มีฟังก์ชัน doPost จากไฟล์ Code.gs ล่าสุด [' + x.message + ']');

    S.cfg = S.me.config;
    const p = getPage();
    S.page = (p === 'admin' && !S.me.isAdmin) ? 'book' : p;
    go(S.page);
  } catch (e) {
    $('#app').innerHTML = `<div class="card"><h3>เปิดระบบไม่สำเร็จ</h3>${toast(e.message)}<button class="btn" onclick="location.reload()">ลองใหม่</button></div>`;
  }
}
function getPage() {
  const q = new URLSearchParams(location.search);
  let p = q.get('page');
  if (!p) { const st = q.get('liff.state'); const m = st && /page=([a-z]+)/.exec(decodeURIComponent(st)); if (m) p = m[1]; }
  return ['book', 'status', 'pay', 'resch', 'reschedule', 'admin', 'applyadmin'].includes(p) ? (p === 'reschedule' ? 'resch' : p) : 'book';
}
function renderNav() {
  const items = [['book', 'จองห้อง'], ['status', 'ตรวจสอบ'], ['pay', 'แจ้งชำระ'], ['resch', 'เลื่อนวัน']];
  if (S.me.isAdmin) items.push(['admin', 'แดชบอร์ด']);
  const n = $('#nav'); n.classList.remove('hide');
  n.innerHTML = items.map(([k, t]) => `<button class="${S.page === k ? 'on' : ''}" onclick="${k === 'pay' ? 'S.pay={};' : ''}go('${k}')">${ICON[k]}<span>${t}</span></button>`).join('');
}
function go(page, opts) {
  if (page === 'book' && !(opts && opts.admin) && S.book && S.book.step === 5) S.book = null;
  S.page = page; closeModal(); window.scrollTo(0, 0);
  $('#app').classList.toggle('wide', page === 'admin');
  renderNav();
  ({ book: pageBook, status: pageStatus, pay: pagePay, resch: pageResch, admin: pageAdmin, applyadmin: pageApplyAdmin })[page](opts);
}

async function pageApplyAdmin() {
  if (S.me.isAdmin) { $('#app').innerHTML = '<div class="card" style="text-align:center"><h1>บัญชีนี้เป็น Admin แล้ว</h1><button class="btn" onclick="go(\'admin\')">เปิดแดชบอร์ด</button></div>'; return; }
  $('#app').innerHTML = `<div class="card" style="max-width:520px;margin:30px auto"><h1>สมัครเป็น Admin</h1><p class="sub">ระบบอ่านบัญชี LINE ที่ล็อกอินอยู่อัตโนมัติ กรุณากรอกเฉพาะชื่อที่ต้องการให้แสดงในรายการ</p>
  <div class="kv"><span>บัญชี LINE</span><b>${esc(S.me.name)}</b></div><label>ชื่อที่แสดง</label><input id="apn" maxlength="60" value="${esc(S.me.name || '')}" placeholder="เช่น คุณแอน"><div id="apmsg"></div><button class="btn" onclick="submitAdminApply()">ส่งคำขอ</button></div>`;
}
async function submitAdminApply() {

}

function newBook(admin) {

  return { step: 1, admin: !!admin, checkIn: addDays(t, 1), checkOut: addDays(t, 2), adults: 2, children: 0, stayType: 'RENTAL_TENT', tarp: false, selTarp: [], mode: 'tent', avail: null, sel: [], zoom: 1, form: { name: S.me.name || '', phone: '', note: '', consent: false }, result: null };
}

  if (opts && opts.admin) S.book = newBook(true);
  if (!S.book) S.book = newBook(false);

}

function bookFrame(inner) {
  const B = S.book, c = S.cfg;
  let h = '';
  if (B.step === 1 && !S.me.adminConfigured) h += `<div class="warn" style="margin-bottom:12px">ยังไม่ได้ตั้งแอดมิน — LINE User ID ของคุณคือ <b style="word-break:break-all">${esc(S.me.userId)}</b><br>นำไปใส่ในชีต Settings ช่อง ADMIN_LINE_USER_IDS เพื่อเปิดแดชบอร์ด</div>`;
  if (B.admin) h += `<div class="warn" style="margin-bottom:12px">โหมดแอดมิน: การจองจะยืนยันทันที (ไม่ผ่านขั้นตอนชำระเงิน) <a href="#" onclick="S.book=null;go('admin');return false">ยกเลิก</a></div>`;
  h += `<div class="hero"><div class="hero-t">${esc(c.campName)}</div><div class="hero-s">${B.admin ? 'จองแทนลูกค้า' : 'จองที่พัก'} · เช็คอิน ${esc(c.checkinTime)} · เช็คเอาท์ ${esc(c.checkoutTime)}${c.contactPhone ? ' · โทร ' + esc(c.contactPhone) : ''}</div></div>`;
  h += '<div class="steps">' + BOOK_STEPS.map((t, i) => { const n = i + 1; return `<div class="step ${B.step > n ? 'done' : B.step === n ? 'on' : ''}"><i>${B.step > n ? '✓' : n}</i>${t}</div>`; }).join('') + '</div>';
  $('#app').innerHTML = h + inner;
}

function renderCal(first) {
  const B = S.book, t = todayStr(), w = $('#calwrap'); if (!w) return;
  const keep = w.scrollTop, [ty, tm] = t.split('-').map(Number), months = [];
  for (let i = 0; i < 8; i++) { const mm = tm - 1 + i; months.push([ty + Math.floor(mm / 12), mm % 12 + 1]); }
  const dow = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
  const ci = B.checkIn, co = B.checkOut;
  w.innerHTML = months.map(([y, m]) => {
    const first1 = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let cells = '';
    for (let i = 0; i < first1; i++) cells += '<span></span>';
    for (let d = 1; d <= dim; d++) {
      const ymd = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const past = !B.admin && ymd < t;
      let c = 'cd';
      if (past) c += ' off';
      if (ymd === t) c += ' today';
      if (ci && ymd === ci) c += ' s' + (co ? ' hasr' : '');
      else if (co && ymd === co) c += ' e';
      else if (ci && co && ymd > ci && ymd < co) c += ' r';
      cells += `<button class="${c}" ${past ? 'disabled' : ''} onclick="calPick('${ymd}')">${d}</button>`;
    }

/* ---------- PromptPay QR (EMVCo) ---------- */
function crc16_(str) {
  let c = 0xFFFF;
  for (let i = 0; i < str.length; i++) { c ^= str.charCodeAt(i) << 8; for (let k = 0; k < 8; k++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
function ppPayload(id, amount) {
  const t = String(id || '').replace(/\D/g, ''); if (!t) return '';
  let type, val;
  if (t.length === 10 && t[0] === '0') { type = '01'; val = '0066' + t.slice(1); }
  else if (t.length === 13) { type = '02'; val = t; }
  else if (t.length === 15) { type = '03'; val = t; }
  else return '';
  const f = (tag, v) => tag + String(v.length).padStart(2, '0') + v;
  const acct = f('00', 'A000000677010111') + f(type, val);
  let d = f('00', '01') + f('01', amount > 0 ? '12' : '11') + f('29', acct) + f('58', 'TH') + f('53', '764');
  if (amount > 0) d += f('54', Number(amount).toFixed(2));
  d += '6304';
  return d + crc16_(d);
}
function ppQrPng(payload) {
  if (typeof qrcode !== 'function' || !payload) return '';
  const q = qrcode(0, 'M'); q.addData(payload); q.make();
  const n = q.getModuleCount(), sc = 8, mg = 4, size = (n + mg * 2) * sc, c = document.createElement('canvas');

function compress(file, max = 1400) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}

  ${pend.map(p => `<div class="row"><button class="btn sm" onclick="review('${p.id}','APPROVE')">อนุมัติ ${money(p.amount)}</button><button class="btn bad sm" onclick="review('${p.id}','REJECT')">ปฏิเสธ</button></div>`).join('')}
  ${act ? `<button class="btn sec" onclick="adminMove('${esc(b.ref)}','${b.checkIn}')">เลื่อนวันเข้าพัก (แอดมิน)</button><button class="btn sec" style="color:var(--bad);border-color:var(--bad)" onclick="adminCancel('${esc(b.ref)}')">ยกเลิกการจอง</button>` : ''}
  <button class="btn sec" onclick="closeModal()">ปิด</button></div>`);
}
function adminActionText(a) { return ({ BOOKING_CREATED_BY_ADMIN:'รับจองโดย', PAYMENT_APPROVED:'อนุมัติสลิปโดย', PAYMENT_REJECTED:'ปฏิเสธสลิปโดย', BOOKING_RESCHEDULED_BY_ADMIN:'เลื่อนวันโดย', BOOKING_CANCELLED_BY_ADMIN:'ยกเลิกโดย' })[a] || a; }
async function tabPricing() {
  $('#tab').innerHTML = '<div class="card muted" style="text-align:center">กำลังโหลดราคา…</div>';
  const p = await run(() => api('adminPricing'), '#msg'); if (!p) return;
  const field = (id, title, unit, note) => `<label>${esc(title)}</label><div class="row" style="align-items:center"><input id="${id}" type="number" min="0" max="100000" step="1" value="${Number(p[id] || 0)}"><span style="flex:0 0 105px" class="muted">บาท/${esc(unit)}</span></div>${note ? `<div class="muted" style="font-size:12px">${esc(note)}</div>` : ''}`;
  $('#tab').innerHTML = `<div class="card"><h2 style="margin-top:0">ปรับราคาที่พัก</h2><div class="${p.houseSeasonActive ? 'warn' : 'ok'}">${esc(p.notice)}</div>
  ${field('houseNormal','บ้านพัก — ราคาปกติ','หลัง/คืน','ใช้ทุกวันที่อยู่นอกช่วง 15 ธ.ค. – 15 ม.ค.')}
  ${field('houseSeason','บ้านพัก — ราคาช่วงเทศกาล','หลัง/คืน','ระบบสลับราคาอัตโนมัติสำหรับคืนวันที่ 15 ธ.ค. ถึง 15 ม.ค. ของทุกปี')}
  ${field('rentalTent','เต็นท์เช่า (ลาน B, C)','ล็อก/คืน')}
  ${field('ownTentPerson','นำเต็นท์มาเอง (ลาน A, D)','ผู้ใหญ่/คืน','เด็กต่ำกว่า 5 ปีไม่คิดค่าบริการ')}
  ${field('tarpLock','พื้นที่กางทาร์ปเพิ่ม 4×4 ม. (ลาน A, D)','พื้นที่/คืน')}
  ${field('carCampPerson','คาร์แคมป์ (ลาน P)','ผู้ใหญ่/คืน')}
  <div id="prmsg" style="margin-top:12px"></div><button class="btn" onclick="savePricing()">บันทึกราคา</button></div>`;
}
async function savePricing() {
  const ids = ['houseNormal','houseSeason','rentalTent','ownTentPerson','tarpLock','carCampPerson'];
  const p = {}; for (const id of ids) p[id] = Number($('#' + id).value);
  if (ids.some(id => !Number.isFinite(p[id]) || p[id] < 0)) { $('#prmsg').innerHTML = toast('กรุณากรอกราคาให้ถูกต้อง'); return; }
  if (!confirm('ยืนยันบันทึกราคาใหม่? ราคานี้จะใช้กับการจองใหม่ทันที')) return;
  const r = await run(() => api('adminSavePricing', p), '#prmsg'); if (!r) return;
  S.cfg.pricing = r; $('#prmsg').innerHTML = toast('บันทึกราคาเรียบร้อย', 'ok');
  setTimeout(tabPricing, 600);
}
async function tabAdmins() {
  if (S.me.role !== 'SUPER_ADMIN') return;
  const data = await run(() => Promise.all([api('adminList'), api('adminRequests')]), '#msg'); if (!data) return;
  const list = data[0], requests = data[1];
  const active = list.filter(x => x.active);
  $('#tab').innerHTML = `${requests.length ? `<div class="card" style="border-color:var(--blue)"><h2>คำขอสมัคร Admin (${requests.length})</h2>${requests.map(r => `<div class="kv" style="align-items:center"><span><b>${esc(r.name)}</b><br><small class="muted">LINE: ${esc(r.lineName || '-')} · รหัส ${esc(r.code)}<br>${fmtDT(r.created)}</small></span><span style="display:flex;gap:6px"><button class="btn sm" onclick="reviewAdminRequest('${esc(r.requestId)}','APPROVE')">อนุมัติ</button><button class="btn bad sm" onclick="reviewAdminRequest('${esc(r.requestId)}','REJECT')">ปฏิเสธ</button></span></div>`).join('')}</div>` : ''}<div class="card"><h2>จัดการผู้ดูแล (${active.length}/6)</h2><p class="muted">Super Admin 1 คน และ Admin ทั่วไปได้สูงสุด 5 คน</p>
  ${active.map(a => `<div class="kv" style="align-items:center"><span><b>${esc(a.name || 'ยังไม่ได้ตั้งชื่อ')}</b><br><small class="muted">${esc(a.userId)} · ${a.role === 'SUPER_ADMIN' ? 'Super Admin' : 'Admin'}</small></span>${a.role === 'SUPER_ADMIN' ? '<b class="chip CONFIRMED">เจ้าของระบบ</b>' : `<button class="btn bad sm" style="flex:0 0 auto" onclick="removeAdmin('${esc(a.userId)}','${esc(a.name)}')">นำออก</button>`}</div>`).join('')}
  </div><div class="card"><h3>เพิ่มหรือแก้ไข Admin</h3><label>ชื่อที่แสดงในรายการ</label><input id="adn" maxlength="60" placeholder="เช่น คุณแอน"><label>LINE User ID</label><input id="adi" placeholder="Uxxxxxxxx..." autocomplete="off"><button class="btn" onclick="saveAdmin()">บันทึก Admin</button></div>`;
}
async function saveAdmin() {
  const name = $('#adn').value.trim(), userId = $('#adi').value.trim();
  const r = await run(() => api('adminSave', { name, userId }), '#msg'); if (r) tabAdmins();
}
async function removeAdmin(userId, name) {
  if (!confirm('นำ ' + (name || userId) + ' ออกจากการเป็น Admin?')) return;
  const r = await run(() => api('adminRemove', { userId }), '#msg'); if (r) tabAdmins();
}
async function reviewAdminRequest(requestId, decision) {
  if (decision === 'REJECT' && !confirm('ปฏิเสธคำขอนี้?')) return;
  const r = await run(() => api('adminReviewRequest', { requestId, decision }), '#msg'); if (r) tabAdmins();
}
async function adminMove(ref, cur) {
  const nd = prompt('วันเช็คอินใหม่ (YYYY-MM-DD) — จำนวนคืนเท่าเดิม', cur); if (!nd || nd === cur) return;
  const r = await run(() => api('adminReschedule', { ref, newCheckIn: nd })); if (!r) return;
  closeModal(); await loadDash();
}
async function adminCancel(ref) {
  const reason = prompt('เหตุผลการยกเลิก (จะแจ้งลูกค้า)'); if (reason === null) return;
  if (!confirm('ยืนยันยกเลิก ' + ref + ' ? ห้องจะถูกปล่อยว่างทันที')) return;
  const r = await run(() => api('adminCancelBooking', { ref, reason })); if (!r) return;
  closeModal(); await loadDash();
}

init();
</script>
</body>
</html>
